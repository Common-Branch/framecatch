name: CI

# Runs on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the code, it never writes to the repo.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # npm ci installs exactly what package-lock.json says, nothing newer.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
